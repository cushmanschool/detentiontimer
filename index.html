<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detention Timer — The Cushman School</title>
  <meta name="description" content="Run detention timers for late students. Refresh-safe, readable across the room.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%230E406A'/%3E%3Cpath d='M50 22v30l20 12' stroke='%23F7F7F4' stroke-width='9' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,500;0,600;0,700;1,500&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <div class="hero-inner">
      <div>
        <p class="hero-label">The Cushman School &mdash; Upper School</p>
        <h1>Detention Timer</h1>
        <p class="hero-sub">Add each student and their minutes. Timers keep running even if this page is refreshed or closed.</p>
      </div>
      <time class="wall-clock" id="wallClock" aria-label="Current time">--:--</time>
    </div>
  </header>

  <main>
    <section class="add-panel" aria-labelledby="addHeading">
      <p class="section-label" id="addHeading">Add a student</p>
      <form id="addForm" novalidate>
        <div class="field field-name">
          <label for="studentName">Name</label>
          <input type="text" id="studentName" autocomplete="off" placeholder="e.g. Jordan M." maxlength="60">
        </div>
        <div class="field">
          <span class="field-label" id="minutesLabel">Minutes</span>
          <div class="chips" role="group" aria-labelledby="minutesLabel">
            <button type="button" class="chip" data-minutes="5">5</button>
            <button type="button" class="chip selected" data-minutes="10" aria-pressed="true">10</button>
            <button type="button" class="chip" data-minutes="15">15</button>
            <button type="button" class="chip" data-minutes="20">20</button>
            <input type="number" id="customMinutes" min="1" max="180" placeholder="other" aria-label="Custom minutes">
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Add student</button>
      </form>
      <p class="form-error" id="formError" role="alert" hidden></p>
    </section>

    <section aria-labelledby="timersHeading">
      <div class="timers-head">
        <p class="section-label" id="timersHeading">Timers</p>
        <button type="button" class="btn btn-ghost" id="startAll" hidden>Start all</button>
      </div>
      <div class="timer-grid" id="timerGrid"></div>
      <p class="empty-state" id="emptyState">No students yet. Add a student above to start a timer.</p>
    </section>
  </main>

  <footer>
    <p>Detention Timer &middot; <a href="https://class.avendano.xyz">class.avendano.xyz</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
